# 快手极速版页面特征与四区域粗定位规则配置
#
# 区域定义 (手机屏幕 Y 轴自上而下归一化区间 0.0 ~ 1.0):
#   1: 顶部区域 [0.00, 0.20) - 状态栏、频道Tab、返回键、跳过按钮
#   2: 中上区域 [0.20, 0.50) - 弹窗主体、收益概览(金币/现金)、大Banner
#   3: 中下区域 [0.50, 0.80) - 任务项、内容列表、互动组件
#   4: 底部区域 [0.80, 1.00] - 底部主导航栏、直播输入框、下载转化栏

regions:
  1:
    name: "顶部区域"
    bounds: [ 0.00, 0.20 ]
  2:
    name: "中上区域"
    bounds: [ 0.20, 0.50 ]
  3:
    name: "中下区域"
    bounds: [ 0.50, 0.80 ]
  4:
    name: "底部区域"
    bounds: [ 0.80, 1.00 ]

# 页面识别规则配置
# 每个规则项包含:
#   - words: 文字列表 (数组形式)
#   - regions: 归属区域列表 [1, 2, 3, 4] (落在该区域内获得完整可信度，在其他区域衰减为 0.4)
#   - confidence: 基础可信度 (0.0 ~ 1.0)
pages:
  弹窗页:
    priority: true # 弹窗覆盖在其他页面上，满足阈值时优先裁决
    rules:
      - words: [ "开宝箱" ]
        regions: [ 1, 2 ]
        confidence: 0.95
      - words: [ "去看广告","继续观看","放弃奖励" ]
        regions: [ 3, 4 ]
        confidence: 1
      - template: [ "关闭" ]
        regions: [ 1, 2 ]
        confidence: 1

  广告页:
    rules:
      - words: [ "跳过广告", "后可跳过", "秒后可领取", "可获得奖励" ]
        regions: [ 1 ]
        confidence: 0.95
      - words: [ "点击下载", "立即安装", "查看详情", "下载并体验", "去应用市场", "继续观看", "残忍离开" ]
        regions: [ 3, 4 ]
        confidence: 0.90
      - words: [ "跳过", "立即参与", "应用权限", "游戏", "试玩" ]
        regions: [ 1, 4 ]
        confidence: 0.50
    patterns:
      - regex: "\\d+\\s*(秒|s)后可"
        confidence: 0.90
      - regex: "可获得\\s*\\d+\\s*金币"
        confidence: 0.85

  直播页:
    rules:
      - words: [ "主播", "进入直播间", "本场点赞", "关注","直播中" ]
        regions: [ 3,4 ]
        confidence: 2

  任务中心:
    rules:
      - words: [ "任务中心", "日常任务", "去赚钱", "金币商城", "金币明细", "话费充值", "规则" ]
        regions: [ 1, 2 ]
        confidence: 0.95
      - words: [ "我的金币", "我的现金", "金币收益", "连续签到", "立即签到", "兑换成现金" ]
        regions: [ 1, 2 ]
        confidence: 0.90
      - words: [ "看视频赚金币", "看广告得金币", "白拿手机", "领福利", "去起床", "去投币" ]
        regions: [ 2, 3 ]
        confidence: 0.85
      - words: [ "签到", "领福利", "去完成", "去看视频", "提现" ]
        regions: [ 1, 2, 3 ]
        confidence: 0.50

  刷视频页:
    rules:
      - words: [ "关注", "发现", "同城", "精选", "推荐" ]
        regions: [ 1 ]
        confidence: 0.90
      - words: [ "赞", "评论", "分享", "收藏", "推荐一下" ]
        regions: [ 3 ]
        confidence: 0.85
      - words: [ "首页", "朋友", "去赚钱", "我" ]
        regions: [ 3,4 ]
        confidence: 0.65
