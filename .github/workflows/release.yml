name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发

permissions:
  contents: write  # 需要写权限来创建 Release

jobs:
  pi-runtime-tests:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare native standalone Pi
        run: python scripts/prepare-pi.py
      - name: Test embedded Pi and search tools without host PATH
        run: go test -count=1 -v ./internal/pibundle ./internal/aiprovider

  windows-task-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Windows task lifecycle
        run: go test -count=1 ./internal/taskmanager ./internal/mdscript ./internal/scheduler

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - name: Validate release version
        run: |
          test "$(cat VERSION | tr -d '\r\n')" = "${GITHUB_REF_NAME}"
          node scripts/sync-version.mjs --check
          node --test scripts/sync-version.test.mjs

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          output_name="mywebscrcpy-${{ matrix.suffix }}"
          bash scripts/build.sh -ldflags="-s -w" -o "${output_name}"
          echo "BINARY_NAME=${output_name}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: mywebscrcpy-${{ matrix.suffix }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: darwin-x86_64
            bundles: app,dmg
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
          - os: ubuntu-24.04
            target: linux-x86_64
            bundles: appimage
    runs-on: ${{ matrix.os }}
    env:
      MYWEBSCRCPY_UPDATER_PUBLIC_KEY: ${{ vars.MYWEBSCRCPY_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DESKTOP_BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - name: Validate release version and signing configuration
        shell: bash
        run: |
          test "$(cat VERSION | tr -d '\r\n')" = "${GITHUB_REF_NAME}"
          test -n "$MYWEBSCRCPY_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/sync-version.mjs --check
          node --test scripts/sync-version.test.mjs
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build complete signed desktop packages
        run: node scripts/build-desktop.mjs --signed
      - name: Verify updater signature and corruption rejection
        run: node scripts/verification/update-signature.mjs
      - name: Go regression
        run: go test ./...
      - name: Verify desktop service lifecycle
        run: node scripts/verification/desktop-service.mjs
      - name: Verify release manifest contracts
        run: node scripts/verification/release-manifest.mjs
      - name: Generate platform update manifest
        run: node scripts/desktop-manifest.mjs desktop/target/release/bundle ${{ matrix.target }} desktop-manifest-${{ matrix.target }}.json ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/target/release/bundle/**/*.tar.gz
            desktop/target/release/bundle/**/*.sig
            desktop/target/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.exe
            desktop/target/release/bundle/**/*.AppImage
            desktop-manifest-${{ matrix.target }}.json

  release:
    needs: [build, windows-task-tests, desktop, pi-runtime-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version.md as release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES_FILE=""
          NOTES_SUFFIX=""
          for suffix in feature fix; do
            candidate="docs/versions/${TAG}-${suffix}/version.md"
            if [ -f "$candidate" ]; then
              NOTES_FILE="$candidate"
              NOTES_SUFFIX="$suffix"
              echo "Found release notes at $NOTES_FILE"
              break
            fi
          done
          if [ -z "$NOTES_FILE" ]; then
            echo "::warning::No version.md found for ${TAG}-feature or ${TAG}-fix, falling back to auto-generated notes."
          fi
          echo "notes_file=${NOTES_FILE}" >> $GITHUB_OUTPUT
          echo "notes_suffix=${NOTES_SUFFIX}" >> $GITHUB_OUTPUT
          echo "use_version_md=$([ -n "$NOTES_FILE" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Assemble desktop update manifest
        env:
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: node scripts/merge-desktop-manifests.mjs artifacts

      - name: Create Release (with version.md)
        if: steps.notes.outputs.use_version_md == 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/versions/${{ github.ref_name }}-${{ steps.notes.outputs.notes_suffix }}/version.md
          files: |
            artifacts/linux-amd64/mywebscrcpy-linux-amd64
            artifacts/linux-arm64/mywebscrcpy-linux-arm64
            artifacts/macos-amd64/mywebscrcpy-macos-amd64
            artifacts/macos-arm64/mywebscrcpy-macos-arm64
            artifacts/windows-amd64.exe/mywebscrcpy-windows-amd64.exe
            artifacts/desktop-*/**/*.tar.gz
            artifacts/desktop-*/**/*.sig
            artifacts/desktop-*/**/*.dmg
            artifacts/desktop-*/**/*.exe
            artifacts/desktop-*/**/*.AppImage
            desktop-latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (fallback, auto-generated)
        if: steps.notes.outputs.use_version_md != 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-amd64/mywebscrcpy-linux-amd64
            artifacts/linux-arm64/mywebscrcpy-linux-arm64
            artifacts/macos-amd64/mywebscrcpy-macos-amd64
            artifacts/macos-arm64/mywebscrcpy-macos-arm64
            artifacts/windows-amd64.exe/mywebscrcpy-windows-amd64.exe
            artifacts/desktop-*/**/*.tar.gz
            artifacts/desktop-*/**/*.sig
            artifacts/desktop-*/**/*.dmg
            artifacts/desktop-*/**/*.exe
            artifacts/desktop-*/**/*.AppImage
            desktop-latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [build, windows-task-tests, pi-runtime-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret. Please configure them in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mywebscrcpy:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mywebscrcpy:${{ steps.version.outputs.VERSION }}
