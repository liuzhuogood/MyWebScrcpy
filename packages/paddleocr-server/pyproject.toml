[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-server"
version = "1.23.1"
description = "PaddleOCR sidecar service for MyWebScrcpy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "paddlepaddle>=3.0.0,<4",
  "paddleocr>=3.0.0,<4",
]

[project.scripts]
paddleocr-server = "server:main"
