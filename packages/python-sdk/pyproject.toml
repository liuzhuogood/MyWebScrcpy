[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mywebscrcpy-sdk"
version = "1.20.1"
description = "Python client for MyWebScrcpy device automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/liuzhuogood/MyWebScrcpy"
Documentation = "https://github.com/liuzhuogood/MyWebScrcpy/blob/main/packages/python-sdk/README.md"
Repository = "https://github.com/liuzhuogood/MyWebScrcpy"
Issues = "https://github.com/liuzhuogood/MyWebScrcpy/issues"

[tool.setuptools.packages.find]
where = ["src"]
