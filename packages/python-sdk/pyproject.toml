[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mywebscrcpy-sdk"
version = "1.29.0"
description = "Python client for MyWebScrcpy device automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "websocket-client>=1.8,<2",
  "av>=14,<20",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["websockets>=14,<18"]
vision = ["av>=14,<20", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3"]

[project.urls]
Homepage = "https://github.com/liuzhuogood/MyWebScrcpy"
Documentation = "https://github.com/liuzhuogood/MyWebScrcpy/blob/main/packages/python-sdk/README.md"
Repository = "https://github.com/liuzhuogood/MyWebScrcpy"
Issues = "https://github.com/liuzhuogood/MyWebScrcpy/issues"

[tool.setuptools.packages.find]
where = ["src"]
