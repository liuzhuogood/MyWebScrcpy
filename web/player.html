<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>MyWebScrcpy - 播放器</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="player-page">
  <div class="player-toolbar">
    <a href="/" class="back">← <span class="back-text">设备列表</span></a>
    <span class="title" id="title">设备</span>
    <span class="status" id="status">连接中...</span>
    <span class="status fps-badge" id="fps" style="display:none">0 fps</span>
    <div class="tools">
      <button id="btn-back" title="返回键">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <button id="btn-home" title="Home键">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
      <button id="btn-more" class="more-btn" title="更多" aria-label="更多" aria-expanded="false" aria-controls="more-menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
        </svg>
      </button>
      <div id="more-menu" class="more-menu" hidden>
      <button id="btn-power" title="锁屏（点亮/熄屏）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span>锁屏</span>
      </button>
      <button id="btn-recents" title="最近任务（切换任务）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="18" rx="1"/>
          <rect x="14" y="3" width="7" height="18" rx="1"/>
        </svg>
        <span>最近任务</span>
      </button>
      <button id="btn-rotate" title="横竖屏">
        <svg width="20" height="20" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true">
          <path d="M492 257.1c-2.6-2.6-6-4-9.6-4-3.6 0-7 1.4-9.6 4l-13 13c4.3-61.8-19.5-122.5-65.3-165C356.9 70.2 307.7 51 256.1 51c-26.7 0-52.8 5.1-77.4 15.1-25.5 10.4-48.3 25.6-67.7 45.3-13.2 13.4-24.6 28.5-33.6 44.8-1.9 3.4-2.3 7.4-1.2 11.1 1.1 3.7 3.8 6.8 7.2 8.5 2 1 4.2 1.5 6.4 1.5 5.2 0 9.9-2.8 12.4-7.3 7.9-14.3 17.8-27.5 29.4-39.1 16.8-16.8 36.3-29.8 58.1-38.7 21.1-8.6 43.4-12.9 66.2-12.9 22.9 0 45.2 4.3 66.3 12.9 21.8 8.9 41.4 21.9 58.2 38.8 20.3 20.4 35.4 45.6 43.8 73 7 22.9 9.2 47.3 6.6 71.2l-18.9-18.5c-2.5-2.4-5.8-3.8-9.3-3.8-3.5 0-6.9 1.4-9.4 3.9-5.2 5.2-5.2 13.6 0 18.8l42.8 42.9c1.9 1.9 4.4 2.9 7 2.9 2.6 0 5.1-1 7-2.9l42.1-42.2c5.2-5.3 5.2-13.9-.1-19.2zM428.6 335.9c-2-1-4.2-1.5-6.4-1.5-5.2 0-9.9 2.8-12.4 7.3-7.9 14.3-17.8 27.5-29.4 39.1-16.8 16.8-36.3 29.9-58.2 38.7-21.1 8.9-43.4 12.9-66.3 12.9s-45.2-4.3-66.2-12.9c-21.8-8.9-41.4-21.9-58.2-38.7-37.6-37.8-56-90.9-50.3-143.9l18.4 18.5c2.4 2.4 5.6 3.7 9 3.7 3.4 0 6.6-1.3 9-3.7l1.3-1.3c4.9-4.9 4.9-13 0-17.9l-42.9-43c-1.9-1.9-4.4-2.9-7-2.9-2.6 0-5.1 1-7 2.9l-42 42.3c-5.3 5.3-5.3 13.9 0 19.2 2.6 2.6 6 4 9.6 4 3.6 0 7-1.4 9.6-4l13-13.1c-1.8 25.8 1.3 52 9 76.5 9.9 31.4 26.8 59.3 50.3 82.8 19.5 19.6 42.2 34.7 67.6 45.1 24.5 10 50.4 15 76.9 15 26.5 0 52.4-5.1 76.9-15 25.4-10.3 48.1-25.5 67.6-45.1 13.5-13.5 25-28.8 34.2-45.4 1.9-3.4 2.3-7.4 1.2-11.1-1.2-3.7-3.8-6.8-7.3-8.5z"/>
        </svg>
        <span>横竖屏</span>
      </button>
      <button id="btn-files" title="文件管理">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5Z"/>
        </svg>
        <span>文件管理</span>
      </button>
      <button id="btn-fullscreen" title="全屏" class="fs-btn">
        <svg class="fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
        <span>全屏</span>
        <svg class="fs-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
          <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
          <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
        </svg>
      </button>
      <button id="btn-reboot" title="重启设备" class="danger-action">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg>
        <span>重启设备</span>
      </button>
      </div>
    </div>
  </div>

  <!-- 全屏时的悬浮退出按钮 -->
  <button class="fs-exit-floating" id="fs-exit-float" title="退出全屏">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <dialog id="files-dialog" class="files-modal" aria-label="手机文件管理">
    <div class="files-modal-header">
      <strong>手机文件管理</strong>
      <button id="files-dialog-close" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
    <iframe id="files-frame" title="手机文件管理" loading="lazy"></iframe>
  </dialog>

  <div class="player-main">
    <div class="screen-wrap">
      <canvas id="screen"></canvas>
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div>正在连接设备...</div>
      </div>
      <div class="screen-off-overlay" id="screen-off" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <div>屏幕已关闭</div>
        <div style="font-size:12px;color:#666">点击电源键唤醒</div>
      </div>
      <div class="error-overlay" id="error" style="display:none"></div>
    </div>
  </div>

  <script src="/js/control.js"></script>
  <script src="/js/decoder.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const serial = params.get('serial');
    document.getElementById('title').textContent = serial;

    const canvas = document.getElementById('screen');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error');
    const screenOffOverlay = document.getElementById('screen-off');
    const statusEl = document.getElementById('status');
    const fpsEl = document.getElementById('fps');
    const moreBtn = document.getElementById('btn-more');
    const moreMenu = document.getElementById('more-menu');
    const filesDialog = document.getElementById('files-dialog');
    const filesFrame = document.getElementById('files-frame');
    function setMoreMenu(open) {
      moreMenu.hidden = !open;
      moreBtn.setAttribute('aria-expanded', String(open));
    }
    moreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setMoreMenu(moreMenu.hidden);
    });
    document.addEventListener('click', (e) => {
      if (!moreMenu.contains(e.target) && e.target !== moreBtn) setMoreMenu(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMoreMenu(false);
    });
    document.getElementById('btn-files').addEventListener('click', () => {
      filesFrame.src = `/files.html?serial=${encodeURIComponent(serial)}`;
      filesDialog.showModal();
      setMoreMenu(false);
    });
    document.getElementById('files-dialog-close').addEventListener('click', () => filesDialog.close());
    filesDialog.addEventListener('click', (event) => { if (event.target === filesDialog) filesDialog.close(); });

    const decoder = new ScrcpyDecoder(canvas);
    const packer = new ControlPacker();
    const mainEl = document.querySelector('.player-main');

    decoder.onFps = (fps) => { fpsEl.textContent = fps + ' fps'; };
    decoder.onError = ({ message }) => {
      console.error('[decoder] 通知播放器:', message);
      handleStreamLoss(message);
    };
    decoder.onDecodedFrame = () => { lastDecodedFrameAt = Date.now(); };
    decoder.onDeviceResize = (w, h) => { packer.setDeviceSize(w, h); fitCanvas(); };

    // ===== Canvas 自适应缩放 =====
    // 根据容器大小和视频宽高比，计算 canvas 的最佳显示尺寸
    function fitCanvas() {
      const cw = canvas.width;   // 视频内部宽度
      const ch = canvas.height;  // 视频内部高度
      if (!cw || !ch) return;

      const padding = 24; // .player-main 的 padding*2
      const availW = mainEl.clientWidth - padding;
      const availH = mainEl.clientHeight - padding;
      if (availW <= 0 || availH <= 0) return;

      const ratio = cw / ch;
      let dw = availW;
      let dh = dw / ratio;
      if (dh > availH) {
        dh = availH;
        dw = dh * ratio;
      }
      canvas.style.width = Math.round(dw) + 'px';
      canvas.style.height = Math.round(dh) + 'px';
    }
    // 窗口大小变化时重新计算
    window.addEventListener('resize', fitCanvas);
    // 全屏切换后也要重新计算
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
      document.addEventListener(ev, () => setTimeout(fitCanvas, 100))
    );

    let ws = null;
    let connected = false;
    let connectionId = 0;
    let lastDecodedFrameAt = 0;
    const NO_FRAME_TIMEOUT = 5000;
    let frameWatchdog = null;

    // ===== 连接超时: 3 秒未收到 meta 则显示连接失败 =====
    let connectTimeout = null;
    // 服务端推送的错误消息（静默重试期间缓存，连续失败才展示）
    let lastErrorMsg = '';
    let serverErrorAttempts = 0;
    // 红屏是否已展示：展示期间后台重试不再切回"连接中"，避免闪烁
    let errorShown = false;

    function clearConnectTimeout() {
      if (connectTimeout) {
        clearTimeout(connectTimeout);
        connectTimeout = null;
      }
    }

    function clearFrameWatchdog() {
      if (frameWatchdog) {
        clearInterval(frameWatchdog);
        frameWatchdog = null;
      }
    }

    function startFrameWatchdog() {
      clearFrameWatchdog();
      // 从收到 meta 开始计时，既能发现“连上但始终没有画面”，
      // 也能发现已经播放后持续无新帧。
      lastDecodedFrameAt = Date.now();
      frameWatchdog = setInterval(() => {
        if (!connected || !lastDecodedFrameAt) return;
        if (Date.now() - lastDecodedFrameAt > NO_FRAME_TIMEOUT) {
          handleStreamLoss('视频流已中断，正在重连');
        }
      }, 1000);
    }

    function closeWebSocket() {
      if (!ws) return;
      const oldWs = ws;
      ws = null;
      oldWs.onopen = null;
      oldWs.onmessage = null;
      oldWs.onerror = null;
      oldWs.onclose = null;
      if (oldWs.readyState === WebSocket.OPEN || oldWs.readyState === WebSocket.CONNECTING) {
        oldWs.close();
      }
    }

    function handleStreamLoss(message) {
      if (!connected && reconnectTimer) return;
      connected = false;
      clearFrameWatchdog();
      closeWebSocket();
      setStatus(message || '视频流已中断，正在重连', false);
      reconnect();
    }

    function startConnectTimeout() {
      clearConnectTimeout();
      connectTimeout = setTimeout(() => {
        // 3 秒未收到 meta，显示连接失败（优先展示服务端返回的真实错误）
        showError(lastErrorMsg || '连接超时，请检查设备连接');
      }, 3000);
    }

    // ===== 息屏检测: 通过 ADB 获取真实屏幕状态 =====
    // 使用后端 API 检测设备屏幕电源状态，避免帧间隔推测导致的误判
    let screenOffDetected = false;

    async function checkScreenState() {
      if (!connected || !serial) return;
      try {
        const res = await fetch(`/api/screen-state?serial=${encodeURIComponent(serial)}`);
        const data = await res.json();
        if (data.error) {
          console.warn('[screen-state] 检测失败:', data.error);
          return;
        }
        const isScreenOn = data.screenOn;
        if (isScreenOn === false && !screenOffDetected) {
          screenOffDetected = true;
          screenOffOverlay.style.display = 'flex';
        } else if (isScreenOn === true && screenOffDetected) {
          screenOffDetected = false;
          screenOffOverlay.style.display = 'none';
        }
      } catch (e) {
        console.warn('[screen-state] 请求失败:', e);
      }
    }

    // 每 10 秒检测一次屏幕状态（异步，不阻塞用户操作）
    setInterval(checkScreenState, 10000);

    function showError(msg) {
      clearConnectTimeout();
      errorShown = true;
      loading.style.display = 'none';
      errorBox.style.display = 'flex';
      errorBox.innerHTML = `<div style="font-size:18px;font-weight:600">连接失败</div><div style="font-size:14px">${msg}</div>`;
    }

    function setStatus(text, live) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (live ? ' live' : '');
    }

    // ===== 自动重连 =====
    let reconnectTimer = null;
    let reconnectAttempts = 0;

    function reconnect() {
      if (reconnectTimer) return; // 已在等待重连
      reconnectAttempts++;
      const delay = Math.min(1000 * reconnectAttempts, 5000); // 1s, 2s, 3s... 最多 5s
      setStatus('重连中...(' + reconnectAttempts + ')', false);
      console.log('[ws] ' + delay + 'ms 后重连');
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        // 重置状态
        screenOffDetected = false;
        screenOffOverlay.style.display = 'none';
        // 已亮红屏则保持，后台静默重试；否则回到"连接中"
        if (!errorShown) {
          errorBox.style.display = 'none';
          loading.style.display = 'flex';
        }
        connect();
      }, delay);
    }

    function connect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        closeWebSocket();
      }
      // 重置连接状态（已亮红屏则保持，由 meta 到达时统一清除）
      if (!errorShown) {
        errorBox.style.display = 'none';
      }
      startConnectTimeout();

      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProto}//${location.host}/ws?serial=${encodeURIComponent(serial)}`;
      const socket = new WebSocket(wsUrl);
      ws = socket;
      const currentConnectionId = ++connectionId;
      socket.binaryType = 'arraybuffer';

      socket.onopen = () => {
        if (ws !== socket || currentConnectionId !== connectionId) return;
        reconnectAttempts = 0;
        setStatus('已连接，等待画面...', true);
      };

      socket.onmessage = handleWSMessage;

      function handleWSMessage(event) {
        if (ws !== socket || currentConnectionId !== connectionId) return;
        try {
        if (typeof event.data === 'string') {
          const msg = JSON.parse(event.data);
          if (msg.type === 'meta') {
            clearConnectTimeout();
            serverErrorAttempts = 0;
            lastErrorMsg = '';
            errorShown = false;
            errorBox.style.display = 'none';
            packer.setDeviceSize(msg.width, msg.height);
            try {
              decoder.configure(msg.codec, msg.width, msg.height);
            } catch (error) {
              console.error('[decoder] 初始化失败:', error);
              handleStreamLoss('视频解码初始化失败，正在重连');
              return;
            }
            loading.style.display = 'none';
            setStatus(msg.width + 'x' + msg.height, true);
            fpsEl.style.display = 'inline-block';
            connected = true;
            startFrameWatchdog();
            fitCanvas();
          } else if (msg.type === 'error') {
            // 服务端启动失败（如端口冲突、进程残留）很常见，静默重试：
            // 缓存错误消息，等服务端关闭连接后由 onclose 自动重连，
            // 保持"连接中"界面；连续 3 次失败才亮红屏。
            lastErrorMsg = msg.message || '设备连接错误';
            serverErrorAttempts++;
            console.warn('[ws] 服务端错误（第 ' + serverErrorAttempts + ' 次），静默重试:', lastErrorMsg);
            if (serverErrorAttempts >= 3) {
              showError(lastErrorMsg);
            }
          } else if (msg.type === 'disconnected') {
            // Go 端检测到 video stream 断开（旋转卡死等），自动重连
            console.log('[ws] server 通知断开，准备重连');
            handleStreamLoss('视频流已中断，正在重连');
          }
          return;
        }
        // 二进制视频帧
        const data = new Uint8Array(event.data);
        decoder.handleFrame(data);
        } catch(err) {
          console.error('[ws] message error:', err);
        }
      }

      socket.onerror = (e) => {
        if (ws !== socket || currentConnectionId !== connectionId) return;
        console.error('[ws] error', e);
      };

      socket.onclose = () => {
        if (ws !== socket || currentConnectionId !== connectionId) return;
        console.log('[ws] closed');
        ws = null;
        clearConnectTimeout();
        connected = false;
        clearFrameWatchdog();
        if (reconnectAttempts < 20) {
          reconnect();
        } else {
          showError(lastErrorMsg || '连接失败，请刷新');
          setStatus('连接失败，请刷新', false);
        }
      };
    }

    // ===== 坐标映射: canvas 显示坐标 → 设备像素坐标 =====
    function toDeviceCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = packer.deviceWidth / rect.width;
      const scaleY = packer.deviceHeight / rect.height;
      const x = Math.round((clientX - rect.left) * scaleX);
      const y = Math.round((clientY - rect.top) * scaleY);
      return {
        x: Math.max(0, Math.min(packer.deviceWidth - 1, x)),
        y: Math.max(0, Math.min(packer.deviceHeight - 1, y)),
      };
    }

    function send(bytes) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(bytes);
      }
    }

    // ===== 鼠标事件 → scrcpy 触摸事件 =====
    let mouseDown = false;

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (e.button === 2) {
        // 右键 = 返回
        send(packer.back(KEY_UP));
        return;
      }
      mouseDown = true;
      const { x, y } = toDeviceCoords(e.clientX, e.clientY);
      send(packer.touch(ACTION_DOWN, POINTER_MOUSE, x, y, 1.0, 0x1, 0x1));
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      e.preventDefault();
      const { x, y } = toDeviceCoords(e.clientX, e.clientY);
      send(packer.touch(ACTION_MOVE, POINTER_MOUSE, x, y, 1.0, 0x1, 0x1));
    });

    window.addEventListener('mouseup', (e) => {
      if (!mouseDown) return;
      mouseDown = false;
      const { x, y } = toDeviceCoords(e.clientX, e.clientY);
      send(packer.touch(ACTION_UP, POINTER_MOUSE, x, y, 0.0, 0, 0));
    });

    // 滚轮
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const { x, y } = toDeviceCoords(e.clientX, e.clientY);
      const vscroll = e.deltaY;
      const hscroll = e.deltaX;
      send(packer.scroll(x, y, hscroll, vscroll));
    }, { passive: false });

    // 禁用右键菜单（右键用于返回）
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ===== 键盘事件 =====
    // canvas 不能直接获得焦点，监听 window
    window.addEventListener('keydown', (e) => {
      // 忽略修饰键单独按下
      if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;

      const result = keyboardEventToKeyCode(e);
      if (result) {
        e.preventDefault();
        send(packer.keyCode(KEY_DOWN, result.keycode, result.meta));
        return;
      }
      // 可打印字符 → 文本注入
      if (e.key.length === 1) {
        e.preventDefault();
        send(packer.text(e.key));
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
      const result = keyboardEventToKeyCode(e);
      if (result) {
        e.preventDefault();
        send(packer.keyCode(KEY_UP, result.keycode, result.meta));
      }
    });

    // ===== 工具栏按钮 =====
    document.getElementById('btn-home').addEventListener('click', () => {
      send(packer.keyCode(KEY_DOWN, AKEYCODE.HOME, 0));
      send(packer.keyCode(KEY_UP, AKEYCODE.HOME, 0));
    });
    document.getElementById('btn-back').addEventListener('click', () => {
      // BACK_OR_SCREEN_ON: 需要 DOWN 再 UP 才生效
      send(new Uint8Array([4, KEY_DOWN]));
      send(new Uint8Array([4, KEY_UP]));
    });
    document.getElementById('btn-recents').addEventListener('click', () => {
      send(packer.keyCode(KEY_DOWN, AKEYCODE.APP_SWITCH, 0));
      send(packer.keyCode(KEY_UP, AKEYCODE.APP_SWITCH, 0));
      setMoreMenu(false);
    });
    document.getElementById('btn-power').addEventListener('click', () => {
      // AKEYCODE_POWER (26): 模拟电源键，亮屏/熄屏切换
      send(packer.keyCode(KEY_DOWN, AKEYCODE.POWER, 0));
      send(packer.keyCode(KEY_UP, AKEYCODE.POWER, 0));
      setMoreMenu(false);
    });
    document.getElementById('btn-rotate').addEventListener('click', () => {
      // 使用 scrcpy 协议的 TypeRotateDevice (type=11) 消息旋转设备
      // 设备会自动切换到下一个方向，scrcpy 会发送 session packet 更新分辨率
      const before = `${canvas.width}x${canvas.height}`;
      send(packer.rotate());
      statusEl.textContent = '正在请求旋转…';
      setTimeout(() => {
        const after = `${canvas.width}x${canvas.height}`;
        statusEl.textContent = before === after ? '应用可能锁定方向' : '已切换方向';
      }, 1200);
      setMoreMenu(false);
    });
    document.getElementById('btn-reboot').addEventListener('click', async () => {
      if (!confirm('确定要重启这台设备吗？当前投屏连接会中断。')) return;
      if (!confirm('请再次确认：现在立即重启设备？')) return;
      const button = document.getElementById('btn-reboot');
      button.disabled = true;
      button.querySelector('span').textContent = '正在重启…';
      try {
        const res = await fetch(`/api/reboot?serial=${encodeURIComponent(serial)}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || '重启请求失败');
        setMoreMenu(false);
        setStatus('设备重启中...', false);
      } catch (e) {
        button.disabled = false;
        button.querySelector('span').textContent = '重启设备';
        alert(`重启失败：${e.message}`);
      }
    });

    // ===== 全屏 =====
    const fsBtn = document.getElementById('btn-fullscreen');
    const fsEnter = fsBtn.querySelector('.fs-enter');
    const fsExit = fsBtn.querySelector('.fs-exit');
    const fsExitFloat = document.getElementById('fs-exit-float');
    const playerPage = document.querySelector('.player-page');

    // 伪全屏状态 (iOS 等不支持 Fullscreen API 的浏览器用 CSS 模拟)
    let pseudoFs = false;

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement) || pseudoFs;
    }
    function enterFullscreen() {
      // 优先尝试原生 Fullscreen API
      const el = playerPage;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        const p = req.call(el);
        if (p && p.catch) {
          p.catch(() => {
            // 原生全屏失败 (如 iOS Safari)，回退到伪全屏
            enablePseudoFullscreen();
          });
        }
      } else {
        // 不支持 Fullscreen API，直接用伪全屏
        enablePseudoFullscreen();
      }
    }
    function exitFullscreen() {
      if (pseudoFs) {
        disablePseudoFullscreen();
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    }
    function enablePseudoFullscreen() {
      pseudoFs = true;
      playerPage.classList.add('pseudo-fullscreen');
      onFullscreenChange();
    }
    function disablePseudoFullscreen() {
      pseudoFs = false;
      playerPage.classList.remove('pseudo-fullscreen');
      onFullscreenChange();
    }
    function onFullscreenChange() {
      const inFs = isFullscreen();
      fsEnter.style.display = inFs ? 'none' : '';
      fsExit.style.display = inFs ? '' : 'none';
      fsBtn.title = inFs ? '退出全屏' : '全屏';
      setTimeout(fitCanvas, 100);
    }
    function toggleFullscreen() {
      setMoreMenu(false);
      if (isFullscreen()) exitFullscreen(); else enterFullscreen();
    }

    fsBtn.addEventListener('click', toggleFullscreen);
    fsExitFloat.addEventListener('click', exitFullscreen);

    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => {
      document.addEventListener(ev, onFullscreenChange);
    });

    // ===== 触摸事件支持 (移动端) =====
    let touchActive = false;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchActive = true;
      const { x, y } = toDeviceCoords(t.clientX, t.clientY);
      send(packer.touch(ACTION_DOWN, POINTER_FINGER_BASE, x, y, t.force || 1.0));
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!touchActive) return;
      e.preventDefault();
      const t = e.touches[0];
      const { x, y } = toDeviceCoords(t.clientX, t.clientY);
      send(packer.touch(ACTION_MOVE, POINTER_FINGER_BASE, x, y, t.force || 1.0));
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!touchActive) return;
      touchActive = false;
      const t = e.changedTouches[0];
      const { x, y } = toDeviceCoords(t.clientX, t.clientY);
      send(packer.touch(ACTION_UP, POINTER_FINGER_BASE, x, y, 0));
    });

    // 启动投屏连接
    connect();
  </script>
</body>
</html>
