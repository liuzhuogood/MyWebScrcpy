[package]
name = "mywebscrcpy-gui"
version = "1.20.1"
edition = "2021"
rust-version = "1.90"

[features]
native-verify = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tauri-plugin-updater = "2"
